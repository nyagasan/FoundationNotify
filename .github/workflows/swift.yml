name: Swift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test (Xcode 26 / iOS 26 Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          sudo xcode-select -s "$XCODE_PATH"

      - name: Print toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun simctl list runtimes | grep -E 'iOS' || true

      - name: Swift build (compile check)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Discover scheme
        id: scheme
        run: |
          set -euo pipefail
          xcodebuild -list
          SCHEME="$(xcodebuild -list | awk '/Schemes:/{f=1;next} f && NF{print $1; exit}')"
          echo "Using scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Run tests on iOS 26 Simulator
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
